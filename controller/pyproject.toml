[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain-controller"
version = "0.1.0"
description = "MaleCNS controller for the grok ReBot lab. Lives outside the Swift simulator."
requires-python = ">=3.11"
dependencies = ["numpy", "pyarrow", "pillow", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
malecns-verify = "malecns_cache.lockfile:main"
malecns-prepare = "malecns_cache.prepare:main"
malecns-hop-probe = "arm.hop_probe:main"

[tool.setuptools.packages.find]
include = ["malecns_cache*", "runtime*", "rebot_adapter*", "train*", "arm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
